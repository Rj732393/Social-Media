<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2 class="title">Admin Panel</h2>
    <div id="users" class="user-container"></div>

<script>

function loadUsers() {

    const token = localStorage.getItem("token");

    fetch("http://localhost:5000/admin/users", {
        method: "GET",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        }
    })
    .then(res => res.json())
    .then(data => {

        console.log("Backend Response:", data);

        const container = document.getElementById("users");
        container.innerHTML = "";

        // Agar data array nahi hai toh data.users check karega
        const usersArray = Array.isArray(data)
            ? data
            : (data.users || []);

        if (usersArray.length === 0) {
            container.innerHTML =
                "<p style='text-align:center;'>No users found.</p>";
            return;
        }

        usersArray.forEach((user, index) => {

            const div = document.createElement("div");
            div.classList.add("user-card");
            div.style.animationDelay = `${index * 0.1}s`;

            const userId = user._id || user.id;

            div.innerHTML = `
                <p class="username">
                    <strong>User:</strong> ${user.username}
                </p>

                <p class="email">${user.email}</p>

                <p class="status ${
                    user.isActive ? "active" : "inactive"
                }">
                    ${
                        user.isActive
                        ? "Active ✅"
                        : "Inactive ❌"
                    }
                </p>

                <div class="btn-group">
                    <button class="btn activate"
                        onclick="activate('${userId}')">
                        Activate
                    </button>

                    <button class="btn deactivate"
                        onclick="deactivate('${userId}')">
                        Deactivate
                    </button>

                    <button class="btn delete"
                        onclick="deleteUser('${userId}')">
                        Delete
                    </button>
                </div>
            `;

            container.appendChild(div);
        });
    })
    .catch(err => {
        console.error("Fetch error:", err);
        document.getElementById("users").innerHTML =
            "Error: Backend server is not responding.";
    });
}


function activate(id) {
    fetch(`http://localhost:5000/admin/activate/${id}`, { method: "POST" })
    .then(res => res.json())
    .then(data => {
        alert(data.message || "User Activated"); 
        loadUsers();
    })
    .catch(err => alert("Error activating user"));
}

function deactivate(id) {
    fetch(`http://localhost:5000/admin/deactivate/${id}`, { method: "POST" })
    .then(res => res.json())
    .then(data => {
        alert(data.message || "User Deactivated");
        loadUsers();
    })
    .catch(err => alert("Error deactivating user"));
}

function deleteUser(id) {
    if(!confirm("Are you sure you want to delete this user?")) return;

    fetch(`http://localhost:5000/admin/delete/${id}`, { method: "DELETE" })
    .then(res => res.json())
    .then(data => {
        alert(data.message || "User Deleted");
        loadUsers();
    })
    .catch(err => alert("Error deleting user"));
}

// Window load hone par data fetch karein
window.onload = loadUsers;
</script>
</body>
</html>
